# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test Maya (Linux)

# we keep it manual for now
on:
  workflow_dispatch:
#  push:
#    branches: [ "main", "dev" ]
#  pull_request:
#    branches: [ "main", "dev" ]

jobs:
  maya2024:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    container: mottosso/maya:2024

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: pip install
        run: |
          wget https://bootstrap.pypa.io/pip/get-pip.py
          mayapy get-pip.py --user
          mayapy -m pip install --user \
            coverage==5.5 \
            -r requirements-dev.txt
      - name: Install tikworks
        run: |
          mayapy -m pip install --user -e .
      - name: Test with pytest
        env:
          XDG_RUNTIME_DIR: /var/tmp/runtime-root
          MAYA_DISABLE_ADP: 1
        run: |
          mayapy ./tests/unit/invoke.py
