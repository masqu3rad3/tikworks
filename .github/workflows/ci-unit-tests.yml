# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test Maya (Linux)

# we keep it manual for now
on:
  workflow_dispatch:
#  push:
#    branches: [ "main", "dev" ]
#  pull_request:
#    branches: [ "main", "dev" ]

jobs:
  maya2024:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
       include:
#         - maya: "2024"
#         - maya: "2025"
         - maya: "2026"

    container: mottosso/maya:${{ matrix.maya }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: pip install
        run: |
          wget https://bootstrap.pypa.io/pip/get-pip.py
          mayapy get-pip.py --user --no-cache-dir \
            --index-url http://pypi.org/simple/ \
            --trusted-host pypi.org \
            --trusted-host pypi.python.org \
            --trusted-host files.pythonhosted.org
          mayapy -m pip install --user --no-cache-dir \
            --index-url http://pypi.org/simple/ \
            --trusted-host pypi.org \
            --trusted-host pypi.python.org \
            --trusted-host files.pythonhosted.org \
            coverage==5.5 \
            -r requirements-dev.txt
#          wget https://bootstrap.pypa.io/pip/get-pip.py
#          mayapy get-pip.py --user
#          mayapy -m pip install --user \
#            coverage==5.5 \
#            -r requirements-dev.txt \
#      - name: Environment
#        run: |
#          export XDG_RUNTIME_DIR=/var/tmp/runtime-root
#          export MAYA_DISABLE_ADP=1
#          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
      - name: Test with pytest
        env:
          XDG_RUNTIME_DIR: /var/tmp/runtime-root
          MAYA_DISABLE_ADP: 1
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          mayapy ./tests/unit/invoke.py
