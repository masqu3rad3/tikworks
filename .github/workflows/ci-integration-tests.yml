#
# Maya Integration Tests (Linux)
#

name: Maya Integration Tests (Linux)

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  maya:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
       include:
         - maya: "2024"
         - maya: "2025"
         - maya: "2026"

    container: mottosso/maya:${{ matrix.maya }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: pip install
        run: |
          wget https://bootstrap.pypa.io/pip/get-pip.py
          mayapy get-pip.py --user --no-cache-dir \
            --index-url http://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com
          mayapy -m pip install --user --no-cache-dir \
            --index-url http://mirrors.aliyun.com/pypi/simple/ \
            --trusted-host mirrors.aliyun.com \
            coverage==5.5 \
            -r requirements-dev.txt

      - name: Run integration tests with coverage
        env:
          XDG_RUNTIME_DIR: /var/tmp/runtime-root
          MAYA_DISABLE_ADP: 1
          PYTHONPATH: ${{ github.workspace }}/src/python
        run: |
          mayapy -m coverage run ./tests/integration/invoke.py
          mayapy -m coverage xml -o coverage.xml
          mayapy -m coverage report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.maya }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          flags: maya-integration-${{ matrix.maya }}
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
