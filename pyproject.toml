[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikworks"
version = "0.1.0"
description = "Tikworks core tools"
authors = [{name = "Arda Kutlu", email = "ardakutlu@gmail.com"}]
requires-python = "> 3.10"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src/python"}
packages = { find = {} }

[tool.black]
line-length = 88
target-version = ["py310"]
# tools/polish and utils/converter are parked; format them when they resume
extend-exclude = "vendor|tools/polish|utils/converter"

[tool.isort]
profile = "black"
known_first_party = ["tik"]
skip_glob = ["*/vendor/*", "*/tools/polish/*", "*/utils/converter/*"]
